[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "janelkit-router"
version = "0.2.0.0"
description = "Navegación entre pantallas para JanelKit: pilas de páginas y secciones"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "d4ndres", email = "d4ndres@gmail.com" }]
keywords = ["janelkit", "router", "navigation", "pages", "desktop", "qt", "pyside6"]
dependencies = ["janelkit>=0.2,<0.3"]  # la misma serie que el núcleo (docs/api.md, política de versiones)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Natural Language :: Spanish",
]

[project.urls]
Homepage = "https://github.com/janelkit/janelkit"
Documentation = "https://github.com/janelkit/janelkit/tree/main/packages/janelkit-router#readme"
Repository = "https://github.com/janelkit/janelkit"
Issues = "https://github.com/janelkit/janelkit/issues"
Changelog = "https://github.com/janelkit/janelkit/blob/main/packages/janelkit-router/README.md#cambios"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
janelkit_router = ["*.qml"]
