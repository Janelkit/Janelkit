[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "janelkit"  # libre en PyPI (verificado el 28-10-2026; ver docs/estado.md, decisión 23)
version = "0.1.0"
description = "Componentes de archivo único (.janel) para aplicaciones de escritorio con Python y Qt Quick"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "d4ndres", email = "d4ndres@gmail.com" }]
keywords = ["gui", "desktop", "qt", "pyside6", "qt-quick", "reactive", "components", "framework"]
dependencies = ["PySide6>=6.8,!=6.12.0", "qasync>=0.27"]  # 6.12.0: segfault en el recolector de Python (Linux, macOS)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Natural Language :: Spanish",
]

[project.urls]
Homepage = "https://github.com/janelkit/janelkit"
Documentation = "https://github.com/janelkit/janelkit/tree/main/docs"
Repository = "https://github.com/janelkit/janelkit"
Issues = "https://github.com/janelkit/janelkit/issues"
Changelog = "https://github.com/janelkit/janelkit/blob/main/docs/cambios.md"

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "pyflakes>=3"]

[project.scripts]
janel = "janelkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
janelkit = ["templates/**/*", "qml/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
