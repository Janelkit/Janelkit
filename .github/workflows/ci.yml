# Integración continua de FluxUI: pruebas en Windows, Linux y macOS, con la
# versión mínima declarada de Python y PySide6 y con las más recientes.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  tests:
    name: ${{ matrix.os }} · Python ${{ matrix.python }} · PySide6 ${{ matrix.pyside }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        pyside: ["latest"]
        include:
          # Versión mínima declarada en pyproject.toml (PySide6>=6.8, LTS de Qt).
          - os: ubuntu-latest
            python: "3.10"
            pyside: "6.8.*"
          - os: windows-latest
            python: "3.10"
            pyside: "6.8.*"
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}

      - name: Bibliotecas del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

      - name: Instalar
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.pyside }}" != "latest" ]; then pip install "PySide6==${{ matrix.pyside }}"; fi
          pip install -e ".[dev]"

      - name: Análisis estático
        run: python -m pyflakes src/fluxui tests tools

      - name: Pruebas
        run: python -m pytest -q

      - name: Ejemplos con python main.py
        shell: bash
        run: |
          for example in examples/*/; do
            (cd "$example" && FLUXUI_EXIT_AFTER_MS=500 python main.py)
          done

  wheel:
    name: Wheel en un entorno limpio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    env:
      QT_QPA_PLATFORM: offscreen
      PYTHONUTF8: "1"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliotecas del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo apt-get update
          sudo apt-get install -y libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 fonts-dejavu-core
      - name: Construir, instalar y probar flux new + python main.py + flux build
        run: |
          python -m pip install --upgrade pip build
          python tools/check_wheel.py
