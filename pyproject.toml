[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "fluxui"  # nombre provisional, pendiente de verificar en PyPI
version = "0.0.1.dev0"
description = "Componentes de archivo único (.flux) para aplicaciones de escritorio con Python y Qt Quick"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8", "qasync>=0.27"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "pyflakes>=3", "websockets>=13"]

[project.scripts]
flux = "fluxui.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
fluxui = ["templates/**/*", "qml/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
