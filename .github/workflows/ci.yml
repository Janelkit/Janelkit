# Integración continua de JanelKit, un trabajo por paquete:
#
# - núcleo: solo `janelkit` instalado (demuestra que no necesita el ecosistema), en
#   Windows, Linux y macOS, con la versión mínima declarada de Python y PySide6 y con las
#   más recientes;
# - extensiones: cada una instalada sobre el núcleo de la misma rama, sin la otra;
# - aplicaciones: ejemplos y retos con todo instalado;
# - repositorio: análisis estático y frontera entre paquetes (tests/);
# - wheels: construir e instalar los paquetes fuera del repositorio.
name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

env:
  QT_QPA_PLATFORM: offscreen
  PYTHONUTF8: "1"
  QT_LINUX_LIBS: libegl1 libgl1 libxkbcommon0 libxkbcommon-x11-0 libfontconfig1 libdbus-1-3 fonts-dejavu-core

jobs:
  repo:
    name: Repositorio (pyflakes y frontera)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/janelkit[dev]" -e packages/janelkit-i18n -e packages/janelkit-desktop
      - name: Análisis estático
        run: python -m pyflakes packages apps tests tools
      - name: Frontera y coherencia entre paquetes
        run: python -m pytest -q tests

  core:
    name: janelkit · ${{ matrix.os }} · Python ${{ matrix.python }} · PySide6 ${{ matrix.pyside }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
        python: ["3.10", "3.13"]
        pyside: ["latest"]
        include:
          # Versión mínima declarada en packages/janelkit/pyproject.toml (PySide6>=6.8, LTS de Qt).
          - os: ubuntu-latest
            python: "3.10"
            pyside: "6.8.*"
          - os: windows-latest
            python: "3.10"
            pyside: "6.8.*"
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Bibliotecas del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $QT_LINUX_LIBS
      - name: Instalar solo el núcleo
        shell: bash
        run: |
          python -m pip install --upgrade pip
          if [ "${{ matrix.pyside }}" != "latest" ]; then pip install "PySide6==${{ matrix.pyside }}"; fi
          pip install -e "packages/janelkit[dev]"
      - name: Pruebas del núcleo
        working-directory: packages/janelkit
        run: python -m pytest -q

  extensions:
    name: ${{ matrix.package }} · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        package: [janelkit-i18n, janelkit-desktop]
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliotecas del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $QT_LINUX_LIBS
      - name: Instalar el núcleo y la extensión
        run: |
          python -m pip install --upgrade pip
          pip install -e "packages/janelkit[dev]" -e packages/${{ matrix.package }}
      - name: Pruebas de ${{ matrix.package }}
        working-directory: packages/${{ matrix.package }}
        run: python -m pytest -q

  vscode:
    name: janelkit-vscode (gramática)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m pip install pytest
      - name: Pruebas de la gramática
        working-directory: packages/janelkit-vscode
        run: python -m pytest -q tests

  apps:
    name: Ejemplos y retos · ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliotecas del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $QT_LINUX_LIBS
      - name: Instalar
        run: |
          python -m pip install --upgrade pip
          pip install pytest -e packages/janelkit -e packages/janelkit-i18n -e packages/janelkit-desktop -r apps/requirements.txt
      - name: Pruebas de ejemplos y retos
        run: python -m pytest -q apps/examples/tests apps/challenges/tests
      - name: Ejemplos con python main.py
        shell: bash
        run: |
          for example in apps/examples/*/; do
            [ -f "$example/main.py" ] || continue
            (cd "$example" && JANELKIT_EXIT_AFTER_MS=500 python main.py)
          done

  wheel:
    name: Wheels en un entorno limpio (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [windows-latest, ubuntu-latest, macos-latest]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - name: Bibliotecas del sistema para Qt (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y $QT_LINUX_LIBS
      - name: Construir y probar los wheels (janel new, python main.py, janel build, extensiones)
        run: |
          python -m pip install --upgrade pip build
          python tools/check_wheel.py
