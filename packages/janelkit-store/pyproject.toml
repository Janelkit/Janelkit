[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "janelkit-store"
version = "0.1.0"
description = "Stores para JanelKit: datos compartidos con escritura controlada, seguimiento de cambios y persistencia"
readme = "README.md"
requires-python = ">=3.10"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "d4ndres", email = "d4ndres@gmail.com" }]
keywords = ["janelkit", "store", "state", "reactive", "desktop", "qt", "pyside6"]
# TEMPORAL: >=0.1.1 mientras el núcleo del repositorio no tenga su versión 0.2.0; al fijarla, pasa a
# janelkit>=0.2,<0.3 (necesita janelkit.ext.session, on_write y own, de 0.2).
dependencies = ["janelkit>=0.1.1,<0.3"]  # rango del núcleo probado (docs/api.md, política de versiones)
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Developers",
    "Operating System :: Microsoft :: Windows",
    "Operating System :: MacOS",
    "Operating System :: POSIX :: Linux",
    "Environment :: X11 Applications :: Qt",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Libraries :: Application Frameworks",
    "Topic :: Software Development :: User Interfaces",
    "Natural Language :: Spanish",
]

[project.urls]
Homepage = "https://github.com/janelkit/janelkit"
Documentation = "https://github.com/janelkit/janelkit/tree/main/packages/janelkit-store#readme"
Repository = "https://github.com/janelkit/janelkit"
Issues = "https://github.com/janelkit/janelkit/issues"
Changelog = "https://github.com/janelkit/janelkit/blob/main/packages/janelkit-store/README.md#cambios"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

