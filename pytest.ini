# Toda la suite desde la raíz del repositorio: núcleo, extensiones, aplicaciones y la
# frontera entre ellos (tests/test_boundaries.py). Cada paquete también se prueba solo:
# `python -m pytest packages/janelkit`.
[pytest]
testpaths =
    packages/janelkit/tests
    packages/janelkit-i18n/tests
    packages/janelkit-desktop/tests
    packages/janelkit-vscode/tests
    apps/examples/tests
    apps/challenges/tests
    tests
addopts = --import-mode=importlib
