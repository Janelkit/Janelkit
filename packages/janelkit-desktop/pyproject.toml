[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janelkit-desktop"
version = "0.0.1.dev0"
description = "Diálogos nativos, portapapeles y notificaciones del sistema para JanelKit"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["janelkit>=0.0.1.dev0,<0.1"]  # rango del núcleo probado (docs/api.md, política de versiones)
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"

[tool.setuptools.package-data]
janelkit_desktop = ["icon.png"]
