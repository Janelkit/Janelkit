[build-system]
requires = ["setuptools>=69", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "janelkit"  # libre en PyPI (verificado el 28-10-2026; ver docs/estado.md, decisión 23)
version = "0.0.1.dev0"
description = "Componentes de archivo único (.janel) para aplicaciones de escritorio con Python y Qt Quick"
readme = "README.md"
requires-python = ">=3.10"
dependencies = ["PySide6>=6.8", "qasync>=0.27"]
classifiers = [
    "Development Status :: 2 - Pre-Alpha",
    "Programming Language :: Python :: 3",
    "Topic :: Software Development :: User Interfaces",
]

[project.optional-dependencies]
dev = ["pytest>=8", "build>=1", "pyflakes>=3"]

[project.scripts]
janel = "janelkit.cli.main:main"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
janelkit = ["templates/**/*", "qml/**/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "--import-mode=importlib"
